<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pawprints</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232a2217'/%3E%3Cg fill='%23f0a040'%3E%3Cellipse cx='16' cy='20.5' rx='5.6' ry='4.6'/%3E%3Cellipse cx='9.4' cy='14.2' rx='2.2' ry='2.8'/%3E%3Cellipse cx='13.6' cy='10.2' rx='2.2' ry='2.9'/%3E%3Cellipse cx='18.4' cy='10.2' rx='2.2' ry='2.9'/%3E%3Cellipse cx='22.6' cy='14.2' rx='2.2' ry='2.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="masthead">
  <div class="wrap bar">
    <a class="brand" href="#overview" aria-label="Pawprints, overview">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--accent-soft)"/>
        <g fill="var(--paw)">
          <ellipse cx="16" cy="20.5" rx="5.6" ry="4.6"/>
          <ellipse cx="9.4" cy="14.2" rx="2.2" ry="2.8" transform="rotate(-18 9.4 14.2)"/>
          <ellipse cx="13.6" cy="10.2" rx="2.2" ry="2.9" transform="rotate(-6 13.6 10.2)"/>
          <ellipse cx="18.4" cy="10.2" rx="2.2" ry="2.9" transform="rotate(6 18.4 10.2)"/>
          <ellipse cx="22.6" cy="14.2" rx="2.2" ry="2.8" transform="rotate(18 22.6 14.2)"/>
        </g>
      </svg>
      <span class="wordmark">Pawprints</span>
    </a>
    <nav class="tabs" aria-label="Screens">
      <a href="#overview" data-view="overview" title="Overview (1)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Overview</a>
      <a href="#projects" data-view="projects" title="Projects (2)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>Projects</a>
      <a href="#sessions" data-view="sessions" title="Sessions (3)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h10M4 19h13"/></svg>Sessions<span class="count" id="live-count" hidden></span></a>
      <a href="#files" data-view="files" title="Files (4)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7Z"/><path d="M14 3v5h5"/></svg>Files</a>
    </nav>
    <div class="right">
      <span class="live off" id="live" title="Connecting…"><i></i><span>Live</span></span>
      <div class="seg" role="group" aria-label="Time range" id="range">
        <button type="button" id="r-1h" data-range="1h" aria-pressed="false" title="Last hour ([ and ] change the range)">1h</button>
        <button type="button" id="r-24h" data-range="24h" aria-pressed="true" title="Last 24 hours">24h</button>
        <button type="button" id="r-7d" data-range="7d" aria-pressed="false" title="Last 7 days">7d</button>
        <button type="button" id="r-30d" data-range="30d" aria-pressed="false" title="Last 30 days">30d</button>
      </div>
      <div class="seg icons" role="group" aria-label="Theme" id="theme">
        <button type="button" id="t-system" data-theme-choice="system" aria-pressed="true" aria-label="Match system theme" title="System"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button type="button" id="t-light" data-theme-choice="light" aria-pressed="false" aria-label="Light theme" title="Light"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button type="button" id="t-dark" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="app"><p class="loading">Loading…</p></main>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
